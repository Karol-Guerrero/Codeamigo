<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12345A">
  <title>Codeamigo - Aprender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Letra Inter. Se carga "en segundo plano" para que la app abra rápido aunque no haya internet. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Esta misma página sirve para todos los cursos.
       curso.js la llena según el curso: curso.html?id=python, ?id=control o ?id=cpp -->
  <div class="app" id="app">

    <!-- Barra blanca de arriba -->
    <header class="barra-curso">
      <a class="volver" href="inicio.html"><i data-icono="atras"></i>Inicio</a>
      <img class="logo" src="img/logo.png" alt="Codeamigo" data-respaldo="logo-respaldo">
      <span class="chip" id="chip"></span>
    </header>

    <!-- Portada del curso -->
    <section class="portada">
      <div class="texto">
        <p class="ceja mono" id="curso-ruta"></p>
        <h1 id="curso-titulo"></h1>
        <p class="lema" id="curso-lema"></p>
      </div>
      <div id="curso-imagen">
        <img class="mascota" src="img/mascota.png" alt="" data-respaldo="mascota-respaldo chica">
      </div>

      <div class="terminal mono" id="terminal" hidden></div>

      <div class="avance" id="avance">
        <div class="fila">
          <span id="avance-texto"></span>
          <span class="mono" id="avance-xp"></span>
        </div>
        <div class="barra"><span id="avance-barra" style="width: 0"></span></div>
      </div>
    </section>

    <main class="contenido">

      <!-- Solo se ve cuando el curso está bloqueado -->
      <div class="aviso-bloqueo" id="aviso-bloqueo" hidden>
        <span class="caja-icono"><i data-icono="candado"></i></span>
        <div>
          <strong>Vista previa · Curso bloqueado</strong>
          <small id="aviso-bloqueo-texto"></small>
        </div>
      </div>

      <div class="seccion-titulo">
        <h2 id="mapa-titulo"></h2>
        <span class="mono etiqueta-mapa" id="mapa-etiqueta"></span>
      </div>

      <!-- Aquí curso.js dibuja los módulos -->
      <ol id="modulos"></ol>

      <div class="aviso-curso" id="aviso">
        <span class="caja-icono" id="aviso-icono"></span>
        <div>
          <strong id="aviso-titulo"></strong>
          <small id="aviso-texto"></small>
        </div>
      </div>

      <div class="fila-reto" id="fila-reto">
        <span id="reto-texto"></span>
        <span class="mono" id="reto-minutos"></span>
      </div>

      <a class="boton-continuar" id="continuar" href="#">
        <span>
          <strong id="continuar-titulo">Continuar lección</strong>
          <small id="continuar-detalle"></small>
        </span>
        <i data-icono="flecha-larga"></i>
      </a>

      <p class="nota centrado" id="nota-bloqueo" hidden></p>
    </main>

    <!-- Barra de abajo -->
    <nav class="barra-inferior" aria-label="Secciones">
      <a href="inicio.html"><i data-icono="casa"></i>Inicio</a>
      <a class="activo" href="curso.html" aria-current="page"><i data-icono="libro"></i>Aprender</a>
      <a href="logros.html"><i data-icono="trofeo"></i>Logros</a>
      <a href="perfil.html"><i data-icono="usuario"></i>Perfil</a>
    </nav>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/cursos.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/curso.js"></script>
</body>
</html>
